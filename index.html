function metroClick(ctx,t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=1000;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.07)}
function metroScheduler(ctx,bpm=120){
 const step=60/bpm; let next=ctx.currentTime+0.05;
 return setInterval(()=>{if(ctx.state!=="running")return;if(next<ctx.currentTime)next=ctx.currentTime+0.02;while(next<ctx.currentTime+0.15){metroClick(ctx,next);next+=step}},25);
}
function reaCloudMetro(c,on){if(c&&c.callerId&&db.cloud?.enabled)cloudRequest(`callRequests/${encodeURIComponent(String(c.callerId))}`,"PATCH",{metronome:!!on,metroAt:new Date().toISOString()})}
function reaMetro(id){
 const c=simCallById(id); if(!c)return;
 if(reaMetroCall===String(id)){reaStopMetro();return}
 reaStopMetro();
 try{reaMetroTimer=metroScheduler(simCtx());reaMetroCall=String(id)}catch(e){toast("Ton konnte nicht gestartet werden");return}
 c.rea=c.rea||{open:true,start:Date.now(),steps:[]}; c.rea.metroUsed=true; c.rea.metroStart=Date.now();
 reaCloudMetro(c,true);
 if(c.sim&&!c.phoneEnd){if(c.sim.d.cpr){c.sim.cprStarted=true;setTimeout(()=>{if(!c.phoneEnd){simSay(c,pick(["Okay, ich hör das Piepen… ich drück im Takt… eins, zwei, drei, vier…","Im Takt… okay… eins, zwei, drei…"]));save();simRefresh()}},900)}}
 save(); floatSig=""; renderFloat();
}
function reaStopMetro(){
 if(reaMetroTimer){clearInterval(reaMetroTimer);reaMetroTimer=null}
 if(reaMetroCall){const c=simCallById(reaMetroCall);if(c)reaCloudMetro(c,false)}
 reaMetroCall=null; floatSig="";
}
function reaStep(id,i){
 const c=simCallById(id); if(!c||!c.rea)return;
 c.rea.steps=c.rea.steps||[]; if(!c.rea.steps.includes(i))c.rea.steps.push(i);
 save();
 if(c.sim&&!c.phoneEnd)simSendFrom(id,null,REA_STEPS[i]); else {floatSig="";renderFloat()}
}
function reaUnitsOf(c,re){return (c.alarmedUnits||[]).map(id=>db.units.find(u=>String(u.id)===String(id))).filter(u=>u&&re.test(String(u.type||"")))}
function reaArrive(id,kind){
 const c=simCallById(id); if(!c||!c.rea)return;
 const list=reaUnitsOf(c,kind==="NEF"?/NEF/:/RTW/);
 if(!list.length){toast(`Kein ${kind} alarmiert`);return}
 const u=list.find(x=>String(x.status)!=="4")||list[0];
 if(String(u.status)!=="4")setUnitStatus(u,"4");
 reaClose(c,`${kind} angekommen (${u.opta||u.name}) – Status 4`);
 if(c.sim&&!c.phoneEnd){simSay(c,pick(["Da sind sie! Gott sei Dank!","Ich hör sie an der Tür – die sind da!"]));simRefresh()}
 toast(`🫀 ${u.opta||u.name}: Status 4 – Protokoll geschlossen`);
}
function reaDismiss(id){
 const c=simCallById(id); if(!c||!c.rea)return;
 if(!confirm("Reanimationsprotokoll ohne Eintreffen schließen (z. B. Fehleinschätzung)?"))return;
 reaClose(c,"ohne Eintreffen geschlossen");
}
function reaClose(c,how){
 if(reaMetroCall===String(c.id))reaStopMetro();
 const dur=fmtDur(Date.now()-c.rea.start);
 c.rea.open=false; c.rea.closedAt=Date.now();
 c.history=c.history||[];
 c.history.push({q:"🫀 Reanimationsprotokoll beendet",a:`${how} · Dauer ${dur} · Metronom ${c.rea.metroUsed?"genutzt":"nicht genutzt"} · Anleitung ${(c.rea.steps||[]).length}/${REA_STEPS.length} Schritte`});
 save(); if(db.cloud?.enabled&&c.alarmTime)setTimeout(()=>pushCallCloud(c),0);
 floatSig=""; renderFloat(); if(!uiLocked&&currentPage!=="notruf")render(currentPage);
}
function floatToggle(k){floatCollapsed[k]=!floatCollapsed[k];floatSig="";renderFloat()}
function reaPanelHTML(c){
 const k="rea"+c.id, col=!!floatCollapsed[k], metro=reaMetroCall===String(c.id), id=esc(String(c.id));
 const rtw=reaUnitsOf(c,/RTW/), nef=reaUnitsOf(c,/NEF/);
 const ub=(list,kind)=>`<button ${list.length?"":"disabled"} onclick="reaArrive('${id}','${kind}')" style="flex:1;font-weight:900;${list.length?"background:#16a34a;color:#fff;border-color:#16a34a":"opacity:.5"}">🚑 ${kind} angekommen</button>`;
 const head=`<div class="row between" style="flex-wrap:nowrap"><b style="color:#b91c1c">🫀 Reanimation · #${id}</b><span style="display:flex;gap:6px;align-items:center">${metro?`<span class="reaDot"></span>`:""}<span class="liveTimer" data-start="${c.rea.start}" style="font-variant-numeric:tabular-nums;font-weight:800">${fmtDur(Date.now()-c.rea.start)}</span><button style="padding:2px 8px" onclick="floatToggle('${k}')">${col?"▴":"▾"}</button></span></div>`;
 const arrive=`<div class="row" style="margin-top:8px;flex-wrap:nowrap;gap:6px">${ub(rtw,"RTW")}${ub(nef,"NEF")}</div>`;
 if(col)return `<div class="card" style="border:2px solid #dc2626">${head}<div class="row" style="margin-top:6px"><button onclick="reaMetro('${id}')" style="flex:1;${metro?"background:#dc2626;color:#fff;border-color:#dc2626":""}">${metro?"⏸ Metronom stoppen":"▶ Metronom 120/min"}</button></div>${arrive}</div>`;
 const steps=REA_STEPS.map((t,i)=>{const done=(c.rea.steps||[]).includes(i);return `<div onclick="reaStep('${id}',${i})" style="cursor:pointer;display:flex;gap:8px;padding:5px 6px;border-radius:8px;margin:2px 0;${done?"background:#dcfce7;color:#166534":"background:#f8fafc"}"><b>${done?"✓":i+1}</b><span>${esc(t)}</span></div>`}).join("");
 const unitRows=[...rtw,...nef].map(u=>`<div style="font-size:13px">${esc(u.opta||u.name)} <span class="muted">(${esc(u.type)})</span> – Status <b>${esc(String(u.status))}</b>${String(u.status)==="4"?" ✅ meldet vor Ort":""}</div>`).join("")||`<div class="muted" style="font-size:13px">Noch kein RTW/NEF alarmiert.</div>`;
 const chat=c.sim&&!c.phoneEnd?`<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:6px"><b style="font-size:13px">🗣️ Anrufer</b><div class="floatLog" style="max-height:120px;overflow:auto">${simLogHTML(c,4)}</div>${simInputRowHTML(c,"reaIn_"+c.id)}</div>`:"";
 return `<div class="card" style="border:2px solid #dc2626">${head}
  <div class="muted" style="font-size:13px;margin-top:2px">${esc(c.location||"Ort noch offen")}${c.keyword?" · "+esc(c.keyword):""}${c.callerId?" · Anrufer-Handy verbunden":""}</div>
  <button onclick="reaMetro('${id}')" style="width:100%;margin-top:8px;padding:12px;font-size:16px;font-weight:900;${metro?"background:#dc2626;color:#fff;border-color:#dc2626":"background:#fee2e2;color:#991b1b;border-color:#fca5a5"}">${metro?`<span class="reaDot" style="background:#fff;vertical-align:middle"></span> Metronom läuft (120/min) – stoppen`:"▶ Metronom 120/min starten"}</button>
  <div class="muted" style="font-size:12px;margin-top:4px">${c.callerId?"Der Takt wird auch auf dem Handy des Anrufers ausgegeben.":c.sim?"Der Übungsanrufer drückt im Takt mit.":"Takt läuft auf diesem Gerät (ins Telefon halten)."}</div>
  <div style="margin-top:8px;font-size:13px"><b>Anleitung (antippen = gesagt${c.sim&&!c.phoneEnd?" und an den Anrufer gesendet":""}):</b>${steps}</div>
  <div style="margin-top:8px">${unitRows}</div>
  ${chat}${arrive}
  <div style="text-align:right;margin-top:6px"><a href="#" onclick="reaDismiss('${id}');return false" class="muted" style="font-size:12px">ohne Eintreffen schließen</a></div>
 </div>`;
}
function simDockHTML(c){
 const k="sim"+c.id, col=!!floatCollapsed[k], id=esc(String(c.id));
 return `<div class="card" style="border:2px solid ${c.sim.num==="19222"?"#1d4ed8":"#e30613"}">
  <div class="row between" style="flex-wrap:nowrap"><b>📞 Anrufer · #${id}${c.keyword?` <span class="muted" style="font-weight:600">${esc(c.keyword)}</span>`:""}</b><span style="display:flex;gap:6px"><button style="padding:2px 8px" onclick="activateCallById('${id}');render('notruf')">Öffnen</button><button style="padding:2px 8px" onclick="floatToggle('${k}')">${col?"▴":"▾"}</button></span></div>
  ${col?"":`<div class="floatLog" style="max-height:130px;overflow:auto">${simLogHTML(c,4)}</div>${simInputRowHTML(c,"dockIn_"+c.id)}`}
 </div>`;
}
function renderFloat(){
 const el=document.getElementById("floatDock"); if(!el)return;
 if(isTerminalLink){el.innerHTML="";return}
 if(!isHandyMode()){const bn=document.getElementById("callerRequestBanner"),tb=document.getElementById("callTimerBar");const top=Math.max(84,(tb?tb.getBoundingClientRect().bottom:0)+8,bn&&bn.innerHTML?bn.getBoundingClientRect().bottom+8:0);el.style.top=Math.min(top,window.innerHeight-260)+"px";el.style.maxHeight=`calc(100vh - ${Math.min(top,window.innerHeight-260)+90}px)`}else{el.style.top="";el.style.maxHeight=""}
 const shown=document.getElementById("simChatBox")&&db.currentCall?String(db.currentCall.id):null;
 const calls=allOpenCalls();
 const reas=calls.filter(c=>c.rea&&c.rea.open);
 const docks=calls.filter(c=>c.sim&&!c.phoneEnd&&simMine(c)&&String(c.id)!==shown&&!(c.rea&&c.rea.open));
 const sig=JSON.stringify([shown,reaMetroCall,simMicOn,simMicBlocked,simVoice,floatCollapsed,reas.map(c=>[c.id,c.rea.steps,c.location,c.keyword,(c.alarmedUnits||[]).map(i=>{const u=db.units.find(x=>String(x.id)===String(i));return u?u.status:""}),c.sim?[c.sim.log.length,c.sim.typing,c.phoneEnd]:0]),docks.map(c=>[c.id,c.keyword,c.sim.log.length,c.sim.typing])]);
 if(sig===floatSig){el.querySelectorAll(".liveTimer").forEach(t=>{t.textContent=fmtDur(Date.now()-Number(t.dataset.start))});return}
 floatSig=sig;
 const ae=document.activeElement, aeId=ae&&el.contains(ae)?ae.id:null;
 const vals={}; el.querySelectorAll("input[id]").forEach(i=>{vals[i.id]=i.value});
 el.innerHTML=reas.map(reaPanelHTML).join("")+docks.map(simDockHTML).join("");
 // Tablet/PC: Seiteninhalt rückt nach links, damit das Fenster nichts verdeckt
 const pad=!isHandyMode()&&el.innerHTML?"414px":"", appEl=document.getElementById("app"); if(appEl&&appEl.style.paddingRight!==pad)appEl.style.paddingRight=pad;
 Object.entries(vals).forEach(([k,v])=>{const i=document.getElementById(k);if(i)i.value=v});
 if(aeId){const i=document.getElementById(aeId);if(i){i.focus();try{i.setSelectionRange(i.value.length,i.value.length)}catch(e){}}}
 el.querySelectorAll(".floatLog").forEach(l=>{l.scrollTop=l.scrollHeight});
 simMicLiveUpdate();
}
function floatTick(){
 if(isTerminalLink)return;
 reaAutoCheck();
 try{simMicEnsure()}catch(e){}
 if(reaMetroCall&&!simCallById(reaMetroCall))reaStopMetro();
 renderFloat();
}

setInterval(()=>{renderCallTimerBar();const clock=document.getElementById("clock");if(clock)clock.textContent=new Date().toLocaleTimeString("de-DE");if(!isTerminalLink){simTick();simSpontaneous();floatTick();simPreparedTick();if(Date.now()%15000<1000)deskHeartbeat()}if(IS_MONITOR)return;applyDutySchedule();autoReturnToStation();autoAdvanceEnRoute();updateWaitTimers()},1000);
renderSimCtl();
try{qsSyncRuleFields()}catch(e){}
setTimeout(()=>{try{deskHeartbeat()}catch(e){}},2500);
// Läuft der Hauptplatz in einem Hintergrund-Tab oder mit gesperrtem Bildschirm, drosseln Browser
// (v. a. mobil/iOS) genau dieses 1-Sekunden-Intervall stark oder pausieren es ganz – der 07:00/
// 19:00-Dienstplanwechsel (applyDutySchedule) wurde dann teils erst mit großer Verzögerung
// nachgeholt. Zusätzlich zum Intervall wird er deshalb sofort beim Zurückkehren in den
// Vordergrund (visibilitychange/focus) erneut ausgeführt.
if(!isTerminalLink){
 const catchUpDutySchedule=()=>{if(document.visibilityState==="visible"&&!IS_MONITOR){applyDutySchedule();if(["leitstelle","mittel"].includes(currentPage))render(currentPage)}};
 document.addEventListener("visibilitychange",catchUpDutySchedule);
 window.addEventListener("focus",catchUpDutySchedule);
}else{
 const catchUpTerminal=()=>{if(document.visibilityState==="visible"&&terminalRefreshFn)terminalRefreshFn()};
 document.addEventListener("visibilitychange",catchUpTerminal);
 window.addEventListener("focus",catchUpTerminal);
}
if(!initVehicleMode()){
 // Bei jedem (Neu-)Start der Leitstelle gehen alle eigenen Fahrzeuge auf Status 2 (Frei auf
 // Wache) zurück – außer solche, die gerade auf Status 6 (Nicht einsatzbereit) stehen, die
 // bleiben bewusst außer Dienst, bis die Leitstelle sie manuell wieder freigibt.
 // Achtung bei mehreren gleichzeitig verbundenen Geräten (Cloud-Sync aktiv): ein Neuladen der
 // Leitstellen-Seite setzt dann auch Fahrzeuge zurück, deren Besatzung selbst gerade unterwegs
 // ist – das ist bewusst so gewünscht, sollte aber während einer laufenden Übung mit mehreren
 // Geräten beachtet werden.
 if(!IS_MONITOR){
   let resetChanged=false;
   db.units.forEach(u=>{
     if(!["6","2"].includes(String(u.status))){ setUnitStatus(u,"2"); resetChanged=true; }
   });
   // Fahrzeuge mit Dienstzeiten werden direkt danach über applyDutySchedule() passend gesetzt.
   applyDutySchedule();
   if(resetChanged)save();
 }
 render(IS_MONITOR?monitorStartPage:"leitstelle");
 if(!IS_MONITOR){cfgSync("aao").then(()=>cfgSync("units"))}
 if(db.cloud?.enabled && !IS_MONITOR) startCloudPolling();
 startStateSync();
}
</script>
<script>
if("serviceWorker" in navigator){
  // Neue Version: sobald ein neuer Service Worker die Kontrolle übernimmt, einmal automatisch
  // neu laden, damit Updates ohne mehrfaches Neuladen ankommen.
  let swReloaded=false;
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(swReloaded||!hadController)return; swReloaded=true; location.reload();
  });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
  });
}
</script>
