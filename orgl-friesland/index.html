<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ORGL-Karte">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>ORGL-Lagekarte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Hell für Tageslicht; dunkel automatisch, wenn das Handy im Dunkelmodus ist */
:root{--paper:#ffffff;--wash:#eef2f6;--ink:#15243a;--mut:#5b6b7f;--line:#d5dce5;--sig:#ff5f00;--sig-ink:#15243a;--warnbg:#fff1e0;--warnln:#f0a04b;--okbg:#e9f6ec;--okln:#7cc28e;--shadow:0 6px 24px rgba(21,36,58,.18);--acc:#ff5f00}
@media (prefers-color-scheme:dark){:root{--paper:#18212c;--wash:#101820;--ink:#eaf0f6;--mut:#9aa8b8;--line:#2c3a4a;--warnbg:#3a2510;--warnln:#a8661f;--okbg:#14301d;--okln:#2e7d47;--shadow:0 6px 24px rgba(0,0,0,.5)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--wash);color:var(--ink);font:16px/1.4 "Atkinson Hyperlegible",system-ui,-apple-system,sans-serif}
#map{position:absolute;inset:0;background:var(--wash)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.pri{background:var(--sig);color:var(--sig-ink);border-color:var(--sig);font-weight:700}

/* Kopf: schmaler Titel links, runde Knöpfe rechts – schwebt über der Karte */
.bar{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:1000;display:flex;align-items:center;gap:8px;pointer-events:none}
.bar>*{pointer-events:auto}
.bar h1{margin:0 auto 0 0;background:var(--paper);border-radius:22px;padding:10px 16px;font-size:17px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap}
.bar h1 small{display:none}
.round{width:46px;height:46px;min-height:46px;padding:0;border-radius:50%;border:0;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}

/* Daumenleiste unten */
#dock{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:1000;display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:6px;background:var(--paper);border-radius:20px;padding:6px;box-shadow:var(--shadow);max-width:520px;margin:0 auto}
#dock button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;border-radius:15px;font-size:13px;padding:6px 2px}
#dock button.on{background:var(--ink);color:var(--paper)}
#dock #bEst{background:var(--sig);color:var(--sig-ink);font-weight:700}
#dock #bEst.on{outline:3px solid var(--ink);outline-offset:-3px}

/* Status als kurze Meldung über der Leiste */
#status{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:1000;background:var(--ink);color:var(--paper);border-radius:14px;padding:8px 14px;font-size:14px;max-width:calc(100% - 40px);text-align:center;box-shadow:var(--shadow);transition:opacity .4s;cursor:pointer}
#wind{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 66px);z-index:1000;background:var(--paper);border-radius:16px;padding:6px 10px;font-size:13px;text-align:center;min-width:64px;box-shadow:var(--shadow);cursor:pointer;line-height:1.2}
#wind .arr{font-size:20px;display:inline-block;line-height:1;font-weight:700}

#cross{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;z-index:900;pointer-events:none;display:none}
#cross:before,#cross:after{content:"";position:absolute;background:var(--sig)}
#cross:before{left:19px;top:0;width:3px;height:40px}#cross:after{top:19px;left:0;height:3px;width:40px}

/* Blatt von unten */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:1100;background:var(--paper);border-radius:22px 22px 0 0;max-height:66%;overflow:auto;padding:22px 18px calc(env(safe-area-inset-bottom) + 18px);display:none;box-shadow:0 -8px 30px rgba(21,36,58,.22);max-width:640px;margin:0 auto}
.sheet:before{content:"";position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--line)}
.sheet.open{display:block}
.sheet h2{font-size:20px;margin:0 44px 6px 0;line-height:1.2}
.sheet h3{font-size:15px;color:var(--mut);margin:16px 0 4px;font-weight:700}
.x{position:absolute;right:12px;top:12px;width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;border:0;background:var(--wash)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row.nav{flex-wrap:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv b{color:var(--mut);font-weight:400}
.warn{background:var(--warnbg);border-left:4px solid var(--warnln);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:15px}
.ok{background:var(--okbg);border-left:4px solid var(--okln);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:15px}
.note{color:var(--mut);font-size:13px;margin-top:12px}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.lg>span:not(.cnt):not(.sw){min-width:0;hyphens:manual}
.lg{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:10px;font-size:13.5px;line-height:1.15;background:var(--wash);cursor:pointer}
.lg input{width:17px;height:17px;margin:0;flex:none;accent-color:var(--ink)}
.lg .cnt{margin-left:auto;color:var(--mut);font-size:12px}
.sw{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);flex:none}
.sq{border-radius:3px}
.bases{display:flex;gap:4px;margin:4px 0 12px;background:var(--wash);padding:4px;border-radius:12px}
.bases button{flex:1;min-height:38px;padding:4px;font-size:14px;border:0;background:transparent}
.bases button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(21,36,58,.15);font-weight:700}
.near{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.near span:last-child{color:var(--mut);white-space:nowrap}
.navb{flex:1 1 30%;text-align:center;text-decoration:none;color:var(--paper);background:var(--ink);border-radius:12px;padding:12px 4px;font-weight:700;min-height:46px;font-size:14px;white-space:nowrap}
select,input[type=text],input[type=password]{font:inherit;color:var(--ink);background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}

/* Kartensymbole */
.mk{display:flex;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid #fff;color:#fff;font:700 9px/1 "Atkinson Hyperlegible",sans-serif;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4)}
.own{border-radius:8px;border:3px solid #15243a;color:#15243a;background:#ffe600;font:700 16px/1 "Atkinson Hyperlegible",sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff,0 3px 10px rgba(0,0,0,.4)}
.leaflet-tooltip.ownLbl{background:#15243a;color:#fff;border:0;font:700 14px/1.2 "Atkinson Hyperlegible",sans-serif;padding:5px 9px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.leaflet-tooltip.ownLbl:before{display:none}
.fix{border-radius:8px;border:2px solid #fff;color:#fff;background:#15243a;font:700 14px/1 "Atkinson Hyperlegible",sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #15243a,0 3px 10px rgba(0,0,0,.35)}
.leaflet-tooltip.fixLbl{background:#fff;color:#15243a;border:2px solid #15243a;font:700 13px/1.2 "Atkinson Hyperlegible",sans-serif;padding:4px 8px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.leaflet-tooltip.fixLbl:before{display:none}
.leaflet-tooltip.measLbl{text-align:center;background:var(--paper);color:var(--ink);border:0;border-radius:8px;font:700 13px/1.2 "Atkinson Hyperlegible",sans-serif;padding:3px 7px;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.leaflet-tooltip.measLbl:before{display:none}

/* Malen */
#drawLayer{position:absolute;inset:0;z-index:950;display:none;touch-action:none;cursor:crosshair}
#drawBar{position:absolute;left:10px;right:10px;z-index:1050;bottom:calc(env(safe-area-inset-bottom) + 12px);background:var(--paper);border-radius:20px;padding:10px;display:none;flex-wrap:wrap;gap:6px;align-items:center;box-shadow:var(--shadow);max-width:520px;margin:0 auto}
#drawBar .c{width:36px;height:36px;min-height:36px;border-radius:50%;padding:0;border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
#drawBar .c.sel{box-shadow:0 0 0 3px var(--ink)}
#drawBar .c.tag{width:auto;min-width:44px;border-radius:18px;padding:0 9px;color:#fff;font-weight:700;font-size:13px}
#drawBar button:not(.c){min-height:40px;padding:6px 11px;font-size:14px;background:var(--wash);border:0}
#drawBar button.on{background:var(--ink);color:var(--paper)}
#drawBar #dDone{background:var(--sig);color:var(--sig-ink);font-weight:700;margin-left:auto}

.leaflet-control-attribution{font-size:10px}
.leaflet-bottom{bottom:calc(env(safe-area-inset-bottom) + 86px)}
.seg{position:absolute;left:10px;top:calc(env(safe-area-inset-top) + 66px);z-index:1000;display:flex;gap:2px;background:var(--paper);border-radius:14px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;min-height:36px;padding:6px 12px;font-size:14px;border-radius:11px}
.seg button.on{background:var(--ink);color:var(--paper);font-weight:700}
.leaflet-control-scale{margin-left:12px!important}
/* Admin-Bereich */
.chip{border:0;background:var(--ink);color:var(--paper);border-radius:22px;min-height:40px;padding:8px 14px;font-weight:700;box-shadow:var(--shadow)}
.bar h1{margin-right:0}.bar #bAdmChip{margin-right:auto}.bar #bAdmChip[hidden]+#bRefresh{margin-left:auto}
.adm{position:absolute;inset:0;z-index:1150;background:var(--wash);overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 24px)}
.adm-in{max-width:640px;margin:0 auto}
.adm-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}.adm-h h2{margin:0 auto 0 0;font-size:22px}
.adm-card{background:var(--paper);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(21,36,58,.08)}
.adm-card h3{margin:0 0 8px;font-size:16px}
.ai{padding:10px 0;border-top:1px solid var(--line)}.ai:first-of-type{border-top:0}
.ai-h{display:flex;align-items:center;gap:8px;font-weight:700}.ai-m{color:var(--mut);font-size:14px;margin:2px 0 6px}
.ai .row{margin-top:4px;flex-wrap:nowrap;gap:5px}.ai .row button{flex:1 1 auto;min-height:38px;padding:6px 4px;font-size:13px;background:var(--wash);border:0;white-space:nowrap}
.tg{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:24px;padding:0 6px;border-radius:6px;color:#fff;background:#15243a;font-size:12px;font-weight:700}
.grp{font-size:14px;color:var(--mut);margin:14px 0 2px;font-weight:700}
#modal{position:absolute;inset:0;z-index:2000;background:rgba(21,36,58,.45);display:none;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--paper);border-radius:20px;padding:20px;max-width:520px;max-height:85%;overflow:auto;box-shadow:var(--shadow)}
#modal p{max-width:65ch}
@media (prefers-reduced-motion:reduce){#status{transition:none}}
</style>
</head>
<body>
<div id="map"></div>
<div id="cross"></div>
<div id="drawLayer"></div>
<div id="drawBar">
  <button class="c sel tag" data-c="#ff7a00" style="background:#ff7a00" aria-label="Landeplatz">LP</button>
  <button class="c tag" data-c="#1e88e5" style="background:#1e88e5" aria-label="Behandlungsplatz">BHP</button>
  <button class="c tag" data-c="#6d4c41" style="background:#6d4c41" aria-label="Bereitstellungsraum">BR</button>
  <button class="c" data-c="#ffd600" style="background:#ffd600" aria-label="Gelb"></button>
  <button class="c" data-c="#00c853" style="background:#00c853" aria-label="Grün"></button>
  <button class="c" data-c="#111111" style="background:#111" aria-label="Schwarz"></button>
  <button id="dMode">Linie</button>
  <button id="dPan">Karte bewegen</button>
  <button id="dUndo">Rückgängig</button>
  <button id="dErase">Radieren</button>
  <button id="dClear">Alles löschen</button>
  <button id="dDone">Fertig</button>
</div>
<div class="bar">
  <h1>ORGL-Karte<small id="sub"></small></h1>
  <button id="bAdmChip" class="chip" hidden>Admin</button>
  <button id="bRefresh" class="round" title="Aktualisieren" aria-label="Aktualisieren"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  <button id="bLayers" class="round" title="Ebenen" aria-label="Ebenen"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
  <button id="bInfo" class="round" title="Hinweise" aria-label="Hinweise"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</div>
<div id="baseSw" class="seg" role="group" aria-label="Kartenansicht"><button data-base="OSM Standard" class="on">Karte</button><button data-base="Luftbild (Esri)">Luftbild</button><button data-base="TopPlus (BKG)">Topo</button></div>
<div id="status">Lade …</div>
<div id="wind" title="Wind"><span class="arr" id="wArr">·</span><div id="wTxt">Wind</div></div>
<nav id="dock">
  <button id="bEst" title="Einsatzstelle setzen"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Einsatz</span></button>
  <button id="bMark" title="Eigene Markierung setzen"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Markieren</span></button>
  <button id="bDraw" title="Auf der Karte malen"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20z"/><path d="M14 7l3 3"/></svg><span>Malen</span></button>
  <button id="bLoc" title="Live-Standort"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>Standort</span></button>
</nav>
<section id="admin" class="adm" aria-label="Admin-Bereich" hidden></section>
<div class="sheet" id="sheet"><button class="x" id="sx" aria-label="Schließen"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="sc"></div></div>
<div id="modal"><div class="box" id="mbox"></div></div>

<script id="core">
"use strict";
/* ================= Konfiguration ================= */
// Größenkriterien Außenlandeplatz RTH (DRF Luftrettung, Checklisten für Feuerwehren):
// Tag: mind. 30 x 30 m (konservativer Wert; DRF nennt teils 25 x 25 m), Nacht: mind. 35 x 70 m.
const LZ_DAY = [30,30], LZ_NIGHT = [35,70];
const WARN_LINE_M = 100;     // Freileitung näher als ... m -> Warnung
const WARN_WIND_M = 300;     // Windenergieanlage näher als ... m -> Warnung
const PARK_MIN_M2 = 1500;    // Parkplatz ab ... m² als möglicher Bereitstellungsraum
const CACHE_KEY = "orgl-fri-v3";
const OVERPASS = ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter"];
// Abfrage pro Kreis (OSM-Relation): Kreisgrenze + alle relevanten Objekte im Kreisgebiet
function qKreis(id){const sel="(area.a)";return `[out:json][timeout:240];
rel(${id});
out geom;
area(${3600000000+id})->.a;
(
 nwr${sel}["aeroway"~"^(helipad|heliport|aerodrome)$"];
 way${sel}["leisure"~"^(pitch|stadium)$"];
 way${sel}["landuse"="recreation_ground"];
 nwr${sel}["amenity"~"^(hospital|fire_station|police|school|community_centre)$"];
 nwr${sel}["emergency"~"^(ambulance_station|water_rescue|lifeguard_base|lifeguard_station|defibrillator)$"];
 nwr${sel}["leisure"="sports_hall"];
 way${sel}["building"="sports_hall"];
 way${sel}["amenity"="parking"]["parking"!~"underground|multi-storey|rooftop"];
 node${sel}["power"="generator"]["generator:source"="wind"];
 way${sel}["power"~"^(line|minor_line)$"];
);
out tags geom;`;}
// Linie vereinfachen (Douglas-Peucker, Toleranz in Metern)
function simplify(pts,tol){if(pts.length<3)return pts;const P=proj(pts[0]);const xy=pts.map(P);const keep=new Uint8Array(pts.length);keep[0]=keep[pts.length-1]=1;
 const st=[[0,pts.length-1]];while(st.length){const [i,j]=st.pop();let md=0,mi=-1;for(let k=i+1;k<j;k++){const d=segDist(xy[k],xy[i],xy[j]);if(d>md){md=d;mi=k;}}if(md>tol){keep[mi]=1;st.push([i,mi],[mi,j]);}}
 return pts.filter((_,k)=>keep[k]);}
const r5=p=>[+p[0].toFixed(5),+p[1].toFixed(5)];

/* Kategorien: key -> {name, color, letter, shape, on} */
const CAT = {
 heli:{n:"H-Landeplatz",c:"#00838f",l:"H",on:true},
 lzN:{n:"Landeplatz Tag + Nacht",c:"#ff7a00",l:"",sq:true,on:true},
 lzD:{n:"Landeplatz nur Tag",c:"#f2c200",l:"",sq:true,on:true},
 pat:{n:"Sammelstelle / BHP",c:"#1e88e5",l:"P",on:true},
 br:{n:"Bereit\u00ADstellungs\u00ADraum",c:"#6d4c41",l:"B",sq:true,on:false},
 kh:{n:"Krankenhaus",c:"#2e7d32",l:"K",on:true},
 wka:{n:"Windrad",c:"#222",l:"✳",on:true},
 pwr:{n:"Freileitung",c:"#7b1fa2",l:"",line:true,on:true},
 own:{n:"Eigene Markierungen",c:"#ffb300",l:"✎",sq:true,on:true},
 fix:{n:"Feste Punkte",c:"#15243a",l:"",sq:true,on:true}
};
const OWN_TYPES = [["LP","Landeplatz (festgelegt)"],["PA","Patientenablage"],["BHP","Behandlungsplatz"],["BR","Bereitstellungsraum"],["SST","Sammelstelle Unverletzte"],["EL","Einsatzleitung / ELW"],["!","Gefahrenstelle"],["T","Text / Sonstiges"]];

/* ================= Hilfsfunktionen Geometrie ================= */
const R = 6371008.8, rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
function dist(a,b){const dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]);const h=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function bearing(a,b){const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0]));const x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return (deg(Math.atan2(y,x))+360)%360;}
const DIRS=["N","NNO","NO","ONO","O","OSO","SO","SSO","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const dirTxt = b => DIRS[Math.round(b/22.5)%16];
const fmtD = m => m<1000? Math.round(m)+" m" : (m/1000).toFixed(m<10000?1:0).replace(".",",")+" km";
// lokale Projektion (Meter) um Bezugspunkt
function proj(o){const k=Math.cos(rad(o[0]));return p=>[rad(p[1]-o[1])*R*k, rad(p[0]-o[0])*R];}
function polyArea(xy){let s=0;for(let i=0,j=xy.length-1;i<xy.length;j=i++)s+=(xy[j][0]+xy[i][0])*(xy[j][1]-xy[i][1]);return Math.abs(s/2);}
function hull(pts){const p=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);if(p.length<3)return p;const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];for(const q of p){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q);}for(let i=p.length-1;i>=0;i--){const q=p[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q);}up.pop();lo.pop();return lo.concat(up);}
// kleinstes umschließendes Rechteck -> [kurz, lang]
function mbr(xy){const h=hull(xy);if(h.length<3)return[0,0];let best=null;for(let i=0;i<h.length;i++){const a=h[i],b=h[(i+1)%h.length];const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);const c=Math.cos(-ang),s=Math.sin(-ang);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const p of h){const x=p[0]*c-p[1]*s,y=p[0]*s+p[1]*c;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}const w=x1-x0,l=y1-y0;if(!best||w*l<best[0]*best[1])best=[w,l];}return best[0]<best[1]?best:[best[1],best[0]];}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];const L=dx*dx+dy*dy;let t=L?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));const x=a[0]+t*dx-p[0],y=a[1]+t*dy-p[1];return Math.hypot(x,y);}
function segSeg(a,b,c,d){const o=(p,q,r)=>Math.sign((q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]));if(o(a,b,c)!==o(a,b,d)&&o(c,d,a)!==o(c,d,b))return 0;return Math.min(segDist(a,c,d),segDist(b,c,d),segDist(c,a,b),segDist(d,a,b));}
function pip(p,xy){let ins=false;for(let i=0,j=xy.length-1;i<xy.length;j=i++){const a=xy[i],b=xy[j];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])ins=!ins;}return ins;}
function centroid(pts){let a=0,b=0;for(const p of pts){a+=p[0];b+=p[1];}return[a/pts.length,b/pts.length];}

/* ================= UTMREF / MGRS (WGS84) ================= */
function utm(lat,lon){let zone=Math.floor((lon+180)/6)+1;if(lat>=56&&lat<64&&lon>=3&&lon<12)zone=32;
 if(lat>=72&&lat<84){if(lon>=0&&lon<9)zone=31;else if(lon>=9&&lon<21)zone=33;else if(lon>=21&&lon<33)zone=35;else if(lon>=33&&lon<42)zone=37;}
 const a=6378137,f=1/298.257223563,k0=0.9996,e2=f*(2-f),ep2=e2/(1-e2);const lo0=rad((zone-1)*6-180+3);const phi=rad(lat),lam=rad(lon);
 const N=a/Math.sqrt(1-e2*Math.sin(phi)**2),T=Math.tan(phi)**2,C=ep2*Math.cos(phi)**2,A=Math.cos(phi)*(lam-lo0);
 const M=a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*phi-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*phi)+(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*phi)-(35*e2**3/3072)*Math.sin(6*phi));
 const E=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
 let Nn=k0*(M+N*Math.tan(phi)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));if(lat<0)Nn+=1e7;return{zone,E,N:Nn};}
function mgrs(lat,lon){const u=utm(lat,lon);const band="CDEFGHJKLMNPQRSTUVWXX"[Math.floor((lat+80)/8)];
 const set=(u.zone%6)||6;const A=65,I=73,O=79,V=86,Z=90;const co="AJSAJS".charCodeAt(set-1),ro="AFAFAF".charCodeAt(set-1);
 let c=co+Math.floor(u.E/1e5)-1,r=ro+Math.floor(u.N/1e5)%20,ro_=false;
 if(c>Z){c=c-Z+A-1;ro_=true;}
 if(c===I||(co<I&&c>I)||((c>I||co<I)&&ro_))c++;
 if(c===O||(co<O&&c>O)||((c>O||co<O)&&ro_)){c++;if(c===I)c++;}
 if(c>Z)c=c-Z+A-1;
 if(r>V){r=r-V+A-1;ro_=true;}else ro_=false;
 if(r===I||(ro<I&&r>I)||((r>I||ro<I)&&ro_))r++;
 if(r===O||(ro<O&&r>O)||((r>O||ro<O)&&ro_)){r++;if(r===I)r++;}
 if(r>V)r=r-V+A-1;
 const e=String(Math.floor(u.E%1e5)).padStart(5,"0"),n=String(Math.floor(u.N%1e5)).padStart(5,"0");
 return `${u.zone}${band} ${String.fromCharCode(c)}${String.fromCharCode(r)} ${e} ${n}`;}
/* ---- OSM-Auswertung (wird auch vom GitHub-Ablauf update-data.js genutzt) ---- */
function geomOf(el){
 if(el.type==="node")return{pt:[el.lat,el.lon]};
 if(el.type==="way"&&el.geometry)return{line:el.geometry.map(g=>[g.lat,g.lon])};
 if(el.type==="relation"&&el.members){const rings=el.members.filter(m=>m.geometry&&m.role!=="inner").map(m=>m.geometry.map(g=>[g.lat,g.lon]));if(rings.length)return{line:[].concat(...rings),rings};}
 return null;}
function nm(t){return t.name||t["name:de"]||t.operator||t.ref||"";}
function processOSM(js){
 const els=js.elements||[];const out={t:Date.now(),bnd:[],pts:[],lz:[],pwr:[],wka:[]};
 const bnd=els.find(e=>e.type==="relation"&&e.tags&&e.tags.boundary==="administrative");
 if(bnd){out.bnd=bnd.members.filter(m=>m.role==="outer"&&m.geometry).map(m=>m.geometry.map(g=>[+g.lat.toFixed(5),+g.lon.toFixed(5)]));}
 const seen=new Set();
 for(const el of els){if(el===bnd||!el.tags)continue;const t=el.tags,g=geomOf(el);if(!g)continue;const id=el.type[0]+el.id;if(seen.has(id))continue;seen.add(id);
  const ring=g.line, c=g.pt||centroid(ring);
  if(t.power==="line"||t.power==="minor_line"){out.pwr.push({id,v:t.voltage||"",k:t.power,g:ring.map(p=>[+p[0].toFixed(6),+p[1].toFixed(6)])});continue;}
  if(t.power==="generator"){out.wka.push({id,c,h:t.height||t["tower:height"]||""});continue;}
  let cat=null,extra={};
  if(t.aeroway==="helipad"||t.aeroway==="heliport")cat="heli";
  else if(t.aeroway==="aerodrome")cat="heli",extra.aerodrome=1;
  else if(t.amenity==="hospital")cat="kh";
  else if(t.emergency==="ambulance_station")cat="rw";
  else if(t.amenity==="fire_station")cat="fw";
  else if(/^(water_rescue|lifeguard_base|lifeguard_station)$/.test(t.emergency||""))cat="wr";
  else if(t.amenity==="police")cat="pol";
  else if(t.emergency==="defibrillator")cat="aed";
  else if(t.leisure==="sports_hall"||t.building==="sports_hall"||t.amenity==="school"||t.amenity==="community_centre")cat="pat";
  else if(t.amenity==="parking"&&ring){const P=proj(c);const a=polyArea(ring.map(P));if(a>=PARK_MIN_M2){cat="br";extra.area=Math.round(a);}}
  else if((t.leisure==="pitch"||t.leisure==="stadium"||t.landuse==="recreation_ground")&&ring&&ring.length>=4){
   const P=proj(c);const xy=ring.map(P);const [s,l]=mbr(xy);const area=polyArea(xy);
   if(s>=LZ_DAY[0]&&l>=LZ_DAY[1]){const night=s>=LZ_NIGHT[0]&&l>=LZ_NIGHT[1];
    out.lz.push({id,cat:night?"lzN":"lzD",c,s:Math.round(s),l:Math.round(l),a:Math.round(area),fill:+(area/(s*l)).toFixed(2),g:ring.map(p=>[+p[0].toFixed(6),+p[1].toFixed(6)]),n:nm(t),sport:t.sport||t.leisure||t.landuse,surf:t.surface||"",lit:t.lit||"",acc:t.access||""});}
   continue;}
  if(cat){let typ=t.amenity||t.emergency||t.aeroway||t.leisure||t.building||"";out.pts.push(Object.assign({id,cat,c,n:nm(t),typ,addr:[t["addr:street"]&&(t["addr:street"]+" "+(t["addr:housenumber"]||"")),t["addr:city"]].filter(Boolean).join(", "),acc:t.access||"",tel:t.phone||t["contact:phone"]||"",ind:t.indoor||"",lvl:t.level||"",op:t.operator||""},extra,ring&&ring.length>=4&&cat!=="br"?{g:(g.rings||[ring]).map(r=>r.map(r5))}:{}));}
 }
 // Gefahrenprüfung je Landeplatz-Kandidat
 for(const z of out.lz){const P=proj(z.c);const zxy=z.g.map(P);let dl=1e9,lv="";
  for(const ln of out.pwr){const lxy=ln.g.map(P);let near=false;for(const p of lxy)if(Math.abs(p[0])<1500&&Math.abs(p[1])<1500){near=true;break;}if(!near)continue;
   for(let i=0;i<lxy.length-1;i++)for(let j=0;j<zxy.length-1;j++){const d=segSeg(lxy[i],lxy[i+1],zxy[j],zxy[j+1]);if(d<dl){dl=d;lv=ln.v;}}
   for(const p of lxy)if(pip(p,zxy)){dl=0;lv=ln.v;}}
  z.dl=Math.round(dl);z.lv=lv;let dw=1e9;for(const w of out.wka)dw=Math.min(dw,dist(z.c,w.c));z.dw=Math.round(dw);}
 // kompakter speichern
 for(const z of out.lz){z.g=z.g.map(r5);z.c=r5(z.c);}
 for(const p of out.pts)p.c=r5(p.c);
 for(const w of out.wka)w.c=r5(w.c);
 for(const ln of out.pwr)ln.g=simplify(ln.g,8).map(r5);
 return out;}
if(typeof module!=="undefined")module.exports={mgrs,utm,mbr,processOSM,qKreis,simplify,pip,dist};
</script>
<script>
"use strict";
if(typeof L==="undefined"){document.getElementById("status").textContent="Kartenbibliothek konnte nicht geladen werden – Internetverbindung prüfen.";throw new Error("no leaflet");}
/* ================= Karte ================= */
const map=L.map("map",{zoomControl:false,preferCanvas:true,renderer:L.canvas({padding:0.5,tolerance:10})}).setView([53.4,7.9],9);
const base={
 "OSM Standard":L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap-Mitwirkende"}),
 "Luftbild (Esri)":L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Luftbild © Esri, Maxar, Earthstar Geographics"}),
 "TopPlus (BKG)":L.tileLayer("https://sgx.geodatenzentrum.de/wmts_topplus_open/tile/1.0.0/web/default/WEBMERCATOR/{z}/{y}/{x}.png",{maxZoom:18,attribution:"© BKG (2026) dl-de/by-2-0"})
};
base["OSM Standard"].addTo(map);
let curBase="OSM Standard";
function setBase(n){map.removeLayer(base[curBase]);curBase=n;base[n].addTo(map);document.querySelectorAll("[data-base]").forEach(b=>b.classList.toggle("on",b.dataset.base===n));}
L.control.scale({imperial:false,position:"bottomleft"}).addTo(map);
const groups={};for(const k in CAT){groups[k]=L.layerGroup();if(CAT[k].on)groups[k].addTo(map);}
let DATA=null,boundaryLayer=null,me=null,meMk=null,meAcc=null,follow=false,watchId=null,estMk=null,est=null,crossMode=null;
const $=id=>document.getElementById(id);
let stT=null;const status=(t,keep)=>{const e=$("status");e.textContent=t;e.style.opacity=1;e.style.display="block";clearTimeout(stT);if(!keep)stT=setTimeout(()=>{e.style.opacity=0;setTimeout(()=>{e.style.display="none";},400);},4000);};

/* ================= Daten laden (ganz Deutschland, pro Kreis) ================= */
const LOG=[];let KREISE=[],IDX_T=0,kreisLayer=null;const KD=new Map();const MAX_LOADED=6,MIN_ZOOM=9;
const bbC=k=>[(k.bb[0]+k.bb[2])/2,(k.bb[1]+k.bb[3])/2];
// OSM liefert die Grenze als Einzelstücke -> zu geschlossenen Ringen zusammensetzen
function assemble(segs){const key=p=>p[0]+","+p[1];const left=segs.map(s=>s.slice());const rings=[];
 while(left.length){let ring=left.shift();let guard=0;
  while(key(ring[0])!==key(ring[ring.length-1])&&guard++<5000){const e=key(ring[ring.length-1]);let i=left.findIndex(s=>key(s[0])===e||key(s[s.length-1])===e);if(i<0)break;let s=left.splice(i,1)[0];if(key(s[0])!==e)s=s.slice().reverse();ring=ring.concat(s.slice(1));}
  if(ring.length>=4)rings.push(ring);}
 return rings;}
function kreisAt(c){for(const k of KREISE){if(c[0]<k.bb[0]||c[0]>k.bb[2]||c[1]<k.bb[1]||c[1]>k.bb[3])continue;if(!k._rings)k._rings=assemble(k.r);let ins=false;for(const r of k._rings)if(pip(c,r))ins=!ins;if(ins)return k;}return null;}
function kreiseNear(c,m){const dla=m/111320,dlo=m/(111320*Math.cos(rad(c[0])));return KREISE.filter(k=>k.bb[0]<=c[0]+dla&&k.bb[2]>=c[0]-dla&&k.bb[1]<=c[1]+dlo&&k.bb[3]>=c[1]-dlo);}
async function loadIndex(){
 try{const r=await fetch("data/kreise.json?"+Math.floor(Date.now()/3600000));if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();KREISE=j.k;IDX_T=j.t;try{localStorage.setItem("orgl-idx",JSON.stringify(j));}catch(e){LOG.push("Kreisliste nicht offline speicherbar");}}
 catch(e){LOG.push("Kreisliste online nicht erreichbar: "+e.message);try{const j=JSON.parse(localStorage.getItem("orgl-idx"));if(j){KREISE=j.k;IDX_T=j.t;LOG.push("Kreisliste aus Offline-Speicher");}}catch(e2){}}
 if(!KREISE.length){status("⚠ Kreisdaten nicht verfügbar – Internet prüfen (antippen für Details)");return;}
 kreisLayer=L.layerGroup(KREISE.map(k=>L.polyline(k.r,{color:"#ffb300",weight:1.8,opacity:.95,dashArray:"7 5",interactive:false}))).addTo(map);
 refreshView();}
function cacheKreis(id,d){let lst=[];try{lst=JSON.parse(localStorage.getItem("orgl-klist")||"[]");}catch(e){}
 lst=lst.filter(x=>x!==id);for(let n=0;n<8;n++){try{localStorage.setItem("orgl-k-"+id,JSON.stringify(d));lst.push(id);localStorage.setItem("orgl-klist",JSON.stringify(lst));return;}catch(e){const old=lst.shift();if(old===undefined)return;try{localStorage.removeItem("orgl-k-"+old);}catch(e2){}}}}
async function loadKreis(k){if(KD.has(k.id)){KD.get(k.id)._last=Date.now();return KD.get(k.id);}
 let d=null;try{const r=await fetch(`data/k/${k.id}.json?${k.t||""}`);if(r.ok)d=await r.json();else LOG.push(`${k.n}: HTTP ${r.status}`);}catch(e){LOG.push(`${k.n}: online nicht erreichbar`);}
 if(d)cacheKreis(k.id,d);else{try{d=JSON.parse(localStorage.getItem("orgl-k-"+k.id));if(d)LOG.push(`${k.n}: aus Offline-Speicher`);}catch(e){}}
 if(!d)return null;d._last=Date.now();KD.set(k.id,d);return d;}
function rebuild(){const all=[...KD.values()];DATA={t:all.length?Math.min(...all.map(d=>d.t)):0,lz:[].concat(...all.map(d=>d.lz)),pts:[].concat(...all.map(d=>d.pts)).filter(p=>CAT[p.cat]),pwr:[].concat(...all.map(d=>d.pwr)),wka:[].concat(...all.map(d=>d.wka))};render();}
function summary(){const c=map.getCenter(),k=kreisAt([c.lat,c.lng]);
 if(map.getZoom()<MIN_ZOOM&&!KD.size){status(`${KREISE.length} Kreise · reinzoomen oder Standort (◎), um Plätze zu laden`);return;}
 status(`${k?k.n+" · ":""}${DATA?DATA.lz.length:0} LP-Kandidaten · ${DATA?DATA.pts.length:0} Objekte${map.getZoom()<MIN_ZOOM?" · zum Nachladen reinzoomen":""}`);}
let busy=false,again=false;
async function ensureKreise(list){let ch=false;for(const k of list){if(!KD.has(k.id)){status(`Lade ${k.n} …`);if(await loadKreis(k))ch=true;}else KD.get(k.id)._last=Date.now();}return ch;}
async function refreshView(){if(!KREISE.length||busy||KD.size>=KREISE.length)return;busy=true;
 try{status("Lade Daten …",true);const res=await Promise.all(KREISE.map(k=>loadKreis(k)));rebuild();
  const ok=res.filter(Boolean).length;status(`${ok} Kreise geladen: ${DATA.lz.length} Landeplätze, ${DATA.pts.length} Objekte`);
 }finally{busy=false;}}
$("status").onclick=()=>{const ks=[...KD.values()].map(d=>d.kreis?d.kreis.n:"?").sort().join(", ");
 sheetOpen(`<h2>Datenstatus</h2><div class="kv"><b>Kreise gesamt</b><span>${KREISE.length}</span><b>Datenstand</b><span>${IDX_T?new Date(IDX_T).toLocaleDateString("de-DE"):"–"} (monatlich automatisch)</span><b>Geladen</b><span>${ks||"–"}</span><b>Landeplätze</b><span>${DATA?DATA.lz.length:0}</span><b>Objekte</b><span>${DATA?DATA.pts.length:0}</span></div><h3>Protokoll</h3><div style="font-size:12px;white-space:pre-wrap">${LOG.slice(-20).join("\n")||"–"}</div><div class="row"><button class="pri" id="rl">⟳ Neu laden</button></div><div class="note">Geladen werden die Kreise im sichtbaren Bereich (ab Zoomstufe ${MIN_ZOOM}), dein Standort-Kreis und die Kreise um die Einsatzstelle. Zuletzt genutzte Kreise bleiben offline gespeichert.</div>`);
 $("rl").onclick=()=>{sheetClose();KD.clear();DATA=null;for(const k in groups)if(k!=="own")groups[k].clearLayers();if(kreisLayer)map.removeLayer(kreisLayer);KREISE=[];loadIndex();};};

/* ================= Darstellung ================= */
function icon(cat,size){const C=CAT[cat];size=size||18;return L.divIcon({className:"",iconSize:[size,size],iconAnchor:[size/2,size/2],html:`<div class="mk" style="width:${size}px;height:${size}px;background:${C.c};${C.sq?"border-radius:4px;":""}${cat==="lzD"?"color:#111;":""}">${C.l}</div>`});}
// Schnell: Punkte als Canvas-Kreise (statt HTML), Umrisse erst ab Zoom 14
const POLY_ZOOM=14;const polyGroups={};for(const k in CAT)polyGroups[k]=L.layerGroup();
function syncPolys(){const z=map.getZoom();for(const k in polyGroups){const on=z>=POLY_ZOOM&&map.hasLayer(groups[k]);if(on&&!map.hasLayer(polyGroups[k]))polyGroups[k].addTo(map);else if(!on&&map.hasLayer(polyGroups[k]))map.removeLayer(polyGroups[k]);}}
map.on("zoomend",syncPolys);
function dot(c,col,r,stroke){return L.circleMarker(c,{radius:r,color:stroke||"#fff",weight:2,fillColor:col,fillOpacity:1,bubblingMouseEvents:false});}
function render(){
 for(const k in groups)if(k!=="own"){groups[k].clearLayers();polyGroups[k].clearLayers();}
 for(const z of DATA.lz){const C=CAT[z.cat];const warn=z.dl<WARN_LINE_M||z.dw<WARN_WIND_M;
  polyGroups[z.cat].addLayer(L.polygon(z.g,{color:warn?"#15243a":C.c,weight:4,opacity:1,fillColor:C.c,fillOpacity:.5,dashArray:warn?"10 6":null}).on("click",()=>showLZ(z)));
  groups[z.cat].addLayer(dot(z.c,C.c,6,warn?"#15243a":"#fff").on("click",()=>showLZ(z)));}
 for(const p of DATA.pts){const C=CAT[p.cat];
  if(p.g)polyGroups[p.cat].addLayer(L.polygon(p.g.map(r=>[r]),{color:C.c,weight:3,opacity:1,fillColor:C.c,fillOpacity:.45}).on("click",()=>showPt(p)));
  if(p.cat==="heli"||p.cat==="kh")groups[p.cat].addLayer(L.marker(p.c,{icon:icon(p.cat,18)}).on("click",()=>showPt(p)));
  else groups[p.cat].addLayer(dot(p.c,C.c,5).on("click",()=>showPt(p)));}
 for(const ln of DATA.pwr){const hv=parseInt(ln.v)>=60000;groups.pwr.addLayer(L.polyline(ln.g,{color:"#7b1fa2",weight:hv?3:2,opacity:.85,dashArray:ln.k==="minor_line"?"6 5":null,interactive:false}));}
 for(const w of DATA.wka){groups.wka.addLayer(dot(w.c,"#222",4).on("click",()=>showWKA(w)));}
 syncPolys();renderOwn();renderFix();updLegendCounts();}

/* ================= Info-Blätter ================= */
function sheetOpen(html){$("sc").innerHTML=html;$("sheet").classList.add("open");$("sheet").scrollTop=0;}
function sheetClose(){$("sheet").classList.remove("open");}
$("sx").onclick=sheetClose;
function posBlock(c){const ref=me||est;let s=`<h3>Lage</h3><div class="kv"><b>UTMREF</b><span>${mgrs(c[0],c[1])}</span><b>WGS84</b><span>${c[0].toFixed(5)}, ${c[1].toFixed(5)}</span>`;

 if($("sFix"))$("sFix").onclick=()=>fixForm(null,c,COL_TYPE[d.c]||"BR","",d.p);}
function drawShape(d){if(!d.a&&isLoop(d.p))d.a=true;const opt={color:d.c,weight:8,opacity:1,lineCap:"round",lineJoin:"round"};
 const l=d.a?L.polygon(d.p,Object.assign(opt,{fillColor:d.c,fillOpacity:.35})):L.polyline(d.p,opt);
 l.on("click",ev=>{L.DomEvent.stop(ev);if(dErase){DRAW=DRAW.filter(x=>x!==d);saveDraw();renderDraw();}else showShape(d);});
 l.bindTooltip(measShort(d),{permanent:true,direction:"center",className:"measLbl"});
 const halo=(d.a?L.polygon:L.polyline)(d.p,{color:d.c==="#111111"?"#fff":"#000",weight:14,opacity:.7,fill:false,lineCap:"round",lineJoin:"round",interactive:false});
 return L.layerGroup([halo,l]);}
function renderDraw(){drawGroup.clearLayers();for(const d of DRAW)drawGroup.addLayer(drawShape(d));}
renderDraw();
const dl=$("drawLayer");
function setDrawUI(){dl.style.display=(!dErase&&!dPan)?"block":"none";$("dErase").classList.toggle("on",dErase);$("dPan").classList.toggle("on",dPan);$("dMode").textContent=dArea?"Fläche":"Linie";}
$("bDraw").onclick=()=>{sheetClose();dErase=false;dPan=false;$("drawBar").style.display="flex";$("dock").style.display="none";$("bDraw").classList.add("on");if(follow){follow=false;$("bLoc").classList.remove("on");}setDrawUI();status("Malmodus: mit dem Finger zeichnen. ✋ zum Verschieben der Karte.");};
$("dDone").onclick=()=>{adminDraw=null;$("drawBar").style.display="none";$("dock").style.display="";dl.style.display="none";dErase=false;$("bDraw").classList.remove("on");status("Malmodus beendet.");};
document.querySelectorAll("#drawBar .c").forEach(b=>b.onclick=()=>{document.querySelectorAll("#drawBar .c").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");dColor=b.dataset.c;dErase=false;dPan=false;setDrawUI();});
$("dMode").onclick=()=>{dArea=!dArea;dErase=false;dPan=false;setDrawUI();};
$("dPan").onclick=()=>{dPan=!dPan;dErase=false;setDrawUI();};
$("dErase").onclick=()=>{dErase=!dErase;dPan=false;setDrawUI();if(dErase)status("Löschen: gezeichnete Linie/Fläche antippen.");};
$("dUndo").onclick=()=>{DRAW.pop();saveDraw();renderDraw();};
$("dClear").onclick=()=>{const b=$("dClear");if(b.dataset.sure){DRAW=[];saveDraw();renderDraw();delete b.dataset.sure;b.textContent="Alles löschen";}else{b.dataset.sure=1;b.textContent="Wirklich?";setTimeout(()=>{delete b.dataset.sure;b.textContent="Alles löschen";},3000);}};
let lastPx=null;
dl.addEventListener("pointerdown",e=>{if(!e.isPrimary)return;e.preventDefault();dl.setPointerCapture(e.pointerId);const ll=map.mouseEventToLatLng(e);curPts=[[ll.lat,ll.lng]];lastPx=[e.clientX,e.clientY];
 cur=L.polyline(curPts,{color:dColor,weight:8,opacity:1,lineCap:"round",lineJoin:"round",interactive:false}).addTo(map);});
dl.addEventListener("pointermove",e=>{if(!cur||!e.isPrimary)return;e.preventDefault();if(Math.hypot(e.clientX-lastPx[0],e.clientY-lastPx[1])<3)return;lastPx=[e.clientX,e.clientY];const ll=map.mouseEventToLatLng(e);curPts.push([ll.lat,ll.lng]);cur.setLatLngs(curPts);});
function endStroke(){if(!cur)return;map.removeLayer(cur);cur=null;if(adminDraw&&curPts.length>=3){const pts=curPts.map(p=>[+p[0].toFixed(6),+p[1].toFixed(6)]),t=adminDraw.t;adminDraw=null;curPts=null;$("dDone").click();fixForm(null,centroid(pts),t,"",pts);return;}if(curPts.length>=2){DRAW.push({c:dColor,a:(dArea&&curPts.length>=3)||isLoop(curPts),p:curPts.map(p=>[+p[0].toFixed(6),+p[1].toFixed(6)])});saveDraw();renderDraw();}curPts=null;}
dl.addEventListener("pointerup",endStroke);dl.addEventListener("pointercancel",endStroke);

/* ================= Hinweise ================= */
function info(){$("mbox").innerHTML=`<h2 style="margin-top:0">Hinweise zur Nutzung</h2>
<p><b>Planungshilfe, kein amtliches Führungsmittel.</b> Alle Objekte stammen automatisiert aus OpenStreetMap (OSM) und können fehlen, veraltet oder falsch sein. Vor Ort immer verifizieren.</p>
<p><b>Landeplatz-Kandidaten</b> sind Sportplätze, Stadien und Freizeitflächen, deren umschließendes Rechteck die Mindestmaße erreicht: <b>Tag ≥ 30 × 30 m</b>, <b>Nacht ≥ 35 × 70 m</b> (DRF Luftrettung, Checklisten für Feuerwehren). Geprüft werden nur Freileitungen (Warnung &lt; ${WARN_LINE_M} m) und Windenergieanlagen (&lt; ${WARN_WIND_M} m), soweit in OSM erfasst. <b>Nicht geprüft</b>: Bäume, Masten, Flutlicht, Zäune, Gebäude, Neigung, Untergrund, Tiere in der Nähe. <b>Den Landeplatz bestimmt immer der Pilot.</b></p>
<p><b>Patientensammelstellen / BHP</b>: Sporthallen, Schulen, Dorfgemeinschaftshäuser. <b>Bereitstellungsräume</b>: Parkplätze ab ${PARK_MIN_M2.toLocaleString("de-DE")} m² (Ebene standardmäßig aus).</p>
<p><b>Bedienung</b>: ◎ Live-Standort (nochmal tippen = Mitführen an/aus) · ✚ Einsatzstelle setzen → nächstgelegene Landeplätze, Sammelstellen, Kliniken · 📍 eigene Markierungen (PA, BHP, BR, LP …) · 🖌 Malen: Linien oder Flächen in 5 Farben, ✋ zum Verschieben der Karte, 🧽 zum Löschen einzelner Striche · Lange auf die Karte tippen = Punktmenü · Windanzeige antippen für Details.</p>
<p><b>Navigation</b>: Bei jedem Objekt startet „Apple Karten / Google Maps / Waze“ die Route von deinem aktuellen Standort zum Ziel direkt in der App.</p>
<p>Markierungen und Zeichnungen werden <b>nur auf diesem Gerät</b> gespeichert und nicht geteilt.</p>
<p><b>Live-Standort</b> funktioniert nur, wenn die Seite über <b>https</b> geöffnet wird (z. B. GitHub Pages) und der Browser die Standortfreigabe erhält.</p>
<p><b>Niedersachsen</b>: Alle Kreisgrenzen Niedersachsens sind immer eingezeichnet (gelb gestrichelt). Die Plätze werden pro Kreis aus fertig ausgewerteten Dateien geladen – für deinen Standort-Kreis, den sichtbaren Bereich ab Kreis-Zoom und den Umkreis der Einsatzstelle. Datenstand: monatlich automatisch aktualisiert. Warnungen zu Leitungen/WEA berücksichtigen nur Objekte im selben Kreis.</p>
<p><b>Offline</b>: Zuletzt genutzte Kreise bleiben im Browser gespeichert, Kartenkacheln nicht. Ohne Netz kann der Kartenhintergrund fehlen.</p>
<p class="note">Daten: © OpenStreetMap-Mitwirkende (ODbL) · Wind: Open-Meteo · Luftbild: Esri · TopPlus: © BKG</p>
<div class="row"><button class="pri" onclick="document.getElementById('modal').style.display='none';try{localStorage.setItem('orgl-fri-ok','1')}catch(e){}">Verstanden</button></div>`;$("modal").style.display="flex";}
$("bInfo").onclick=info;
$("bAdmChip").onclick=openAdmin;
document.querySelectorAll("#baseSw [data-base]").forEach(b=>b.onclick=()=>setBase(b.dataset.base));
$("bRefresh").onclick=()=>{status("Aktualisiere …");location.reload();};
try{if(!localStorage.getItem("orgl-fri-ok"))info();}catch(e){info();}
/* ================= Feste Punkte (Admin) ================= */
// Gespeichert im vorhandenen Lager-Firebase, eigener Bereich sanlager/orgl (das Lager liest diesen Bereich nicht).
const DB_URL="https://lager-52f88-default-rtdb.europe-west1.firebasedatabase.app";
const FIX_URL=DB_URL+"/sanlager/orgl/points";
const ADMIN_CODE="112"; // nur Schnellzugriff, kein echter Schutz
const FIX_KEY="orgl-fix";let FIX=[];try{FIX=JSON.parse(localStorage.getItem(FIX_KEY)||"[]");}catch(e){}
let admin=false,fixMove=null,FIXM={};
const isAdmin=()=>admin;
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function dbReq(path,method,body){const r=await fetch(FIX_URL+path+".json",{method,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}
function fixFromMirror(){FIX=Object.entries(FIXM||{}).filter(([,p])=>p&&p.c).map(([id,p])=>Object.assign({id},p));try{localStorage.setItem(FIX_KEY,JSON.stringify(FIX));}catch(e){}renderFix();}
function setPath(path,data,merge){const k=path.split("/").filter(Boolean);if(!k.length){FIXM=merge?Object.assign(FIXM||{},data):(data||{});return;}let o=FIXM;for(let n=0;n<k.length-1;n++){if(typeof o[k[n]]!=="object"||o[k[n]]===null)o[k[n]]={};o=o[k[n]];}const last=k[k.length-1];if(data===null)delete o[last];else if(merge&&typeof o[last]==="object")Object.assign(o[last],data);else o[last]=data;}
function initFix(){renderFix();try{const es=new EventSource(FIX_URL+".json");
 es.addEventListener("put",e=>{const m=JSON.parse(e.data);setPath(m.path,m.data,false);fixFromMirror();});
 es.addEventListener("patch",e=>{const m=JSON.parse(e.data);setPath(m.path,m.data,true);fixFromMirror();});
 es.onerror=()=>LOG.push("Feste Punkte: Verbindung unterbrochen, versuche erneut …");}catch(e){LOG.push("Feste Punkte: "+e.message);}}
function renderFix(){groups.fix.clearLayers();for(const p of FIX){if(!p.c)continue;const T=OWN_TYPES.find(x=>x[0]===p.t)||["?","Punkt"];
 if(p.g)groups.fix.addLayer(L.polygon(p.g,{color:TYPE_COL[p.t]||"#15243a",weight:3,dashArray:"8 5",fillColor:TYPE_COL[p.t]||"#15243a",fillOpacity:.12}).on("click",()=>showFix(p)));
 const m=L.marker(p.c,{zIndexOffset:700,icon:L.divIcon({className:"",iconSize:[44,30],iconAnchor:[22,15],html:`<div class="fix" style="width:44px;height:30px">${esc(p.t)}</div>`})});
 m.bindTooltip(esc(p.n||T[1]),{permanent:true,direction:"right",offset:[24,0],className:"fixLbl"});m.on("click",()=>showFix(p));groups.fix.addLayer(m);}updLegendCounts();renderAdmin();}
function fbErr(e){status("Nicht gespeichert: "+e.message+". Internet prüfen.");}
function showFix(p){const T=OWN_TYPES.find(x=>x[0]===p.t)||["?","Punkt"];
 sheetOpen(`<h2>${esc(p.n||T[1])}</h2><div>${esc(T[1])}, fest hinterlegt</div>${p.txt?`<div style="margin-top:6px">${esc(p.txt)}</div>`:""}${p.g?"<h3>Bereich</h3>"+measBlock(p.g,true):""}${posBlock(p.c)}
 ${isAdmin()?`<h3>Bearbeiten</h3><div class="row"><button id="fRen">Ändern</button><button id="fMov">Verschieben</button><button id="fDel">Löschen</button></div>`:""}
 <div class="note">Festgelegt${p.ts?" am "+new Date(p.ts).toLocaleDateString("de-DE"):""}.</div>`);
 if(isAdmin()){$("fRen").onclick=()=>fixForm(p);$("fMov").onclick=()=>{fixMove=p;startCross("fixmove");};
  $("fDel").onclick=()=>{const b=$("fDel");if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Wirklich löschen?";return;}dbReq("/"+p.id,"DELETE").then(()=>{sheetClose();status("Gelöscht.");}).catch(fbErr);};}}
function fixForm(p,c,t0,n0,g){const isNew=!p;p=p||{t:t0||"BR",n:n0||"",txt:"",c,g};
 sheetOpen(`<h2>${isNew?(p.g?"Festen Bereich anlegen":"Festen Punkt anlegen"):"Festen Punkt ändern"}</h2>${p.g&&isNew?measBlock(p.g,true):""}<div style="height:8px"></div><select id="xT">${OWN_TYPES.map(t=>`<option value="${t[0]}" ${t[0]===p.t?"selected":""}>${t[1]}</option>`).join("")}</select>
 <div style="height:8px"></div><input type="text" id="xN" placeholder="Name, z. B. BR Sportplatz Schortens" value="${esc(p.n)}"><div style="height:8px"></div><input type="text" id="xX" placeholder="Hinweis, z. B. Zufahrt über Nordstraße (optional)" value="${esc(p.txt)}">
 <div class="row"><button class="pri" id="xS">${isNew?"Für alle speichern":"Änderungen speichern"}</button><button onclick="sheetClose()">Abbrechen</button></div><div class="note">${mgrs(p.c[0],p.c[1])}. Sofort für alle sichtbar.</div>`);
 $("xS").onclick=()=>{const d={t:$("xT").value,n:$("xN").value.trim(),txt:$("xX").value.trim(),c:[+p.c[0].toFixed(6),+p.c[1].toFixed(6)],ts:Date.now()};
  if(p.g)d.g=simplify(p.g,1.5).map(q=>[+q[0].toFixed(6),+q[1].toFixed(6)]);
  (isNew?dbReq("","POST",d):dbReq("/"+p.id,"PATCH",d)).then(()=>{sheetClose();status(isNew?"Für alle gespeichert.":"Änderungen gespeichert.");if(!map.hasLayer(groups.fix))groups.fix.addTo(map);}).catch(fbErr);};}
/* ---- Admin-Bereich (eigener Bildschirm) ---- */
let adminDraw=null,admQ="";
const TYPE_NAME=t=>(OWN_TYPES.find(x=>x[0]===t)||[t,"Sonstiges"])[1];
function closeAdmin(){$("admin").hidden=true;}
function openAdmin(){if(!admin){adminSheet();return;}sheetClose();$("admin").hidden=false;renderAdmin();}
function renderAdmin(){const el=$("admin");if(el.hidden)return;
 const q=admQ.toLowerCase();const list=FIX.filter(p=>!q||(p.n+" "+(p.txt||"")+" "+TYPE_NAME(p.t)).toLowerCase().includes(q));
 const byType=OWN_TYPES.map(([t,name])=>[t,name,list.filter(p=>p.t===t)]).filter(x=>x[2].length);
 const item=p=>{const col=TYPE_COL[p.t]||"#15243a";const meta=[TYPE_NAME(p.t),p.g?fmtA(measure(p.g,true).a):"Punkt",p.ts?new Date(p.ts).toLocaleDateString("de-DE"):""].filter(Boolean).join(", ");
  return `<div class="ai"><div class="ai-h"><span class="tg" style="background:${col}">${esc(p.t)}</span>${esc(p.n||TYPE_NAME(p.t))}</div><div class="ai-m">${esc(meta)}${p.txt?"<br>"+esc(p.txt):""}</div>
  <div class="row"><button data-a="show" data-id="${p.id}">Auf Karte</button><button data-a="edit" data-id="${p.id}">Ändern</button><button data-a="move" data-id="${p.id}">Verschieben</button><button data-a="del" data-id="${p.id}">Löschen</button></div></div>`;};
 el.innerHTML=`<div class="adm-in"><div class="adm-h"><h2>Admin-Bereich</h2><button id="admX" class="round" aria-label="Zur Karte">${'<svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M6 6l12 12M18 6L6 18"/></svg>'}</button></div>
 <div class="adm-card"><h3>Neu anlegen</h3><select id="admT">${OWN_TYPES.map(([t,n])=>`<option value="${t}" ${t==="BR"?"selected":""}>${n}</option>`).join("")}</select>
  <div class="row"><button class="pri" id="admArea">Bereich zeichnen</button><button id="admPt">Punkt setzen</button></div>
  <div class="note">Bereich: Fläche mit dem Finger umfahren, danach Namen eingeben. Punkt: Karte unter das Fadenkreuz schieben.</div></div>
 <div class="adm-card"><h3>Feste Punkte und Bereiche (${FIX.length})</h3><input type="text" id="admQ" placeholder="Suchen" value="${esc(admQ)}">
  ${byType.length?byType.map(([t,name,ps])=>`<div class="grp">${esc(name)} (${ps.length})</div>${ps.sort((a,b)=>(a.n||"").localeCompare(b.n||"","de")).map(item).join("")}`).join(""):`<div class="note">${FIX.length?"Keine Treffer.":"Noch nichts angelegt. Oben „Bereich zeichnen“ oder „Punkt setzen“ wählen."}</div>`}
  ${FIX.length?'<div class="row"><button id="admCopy">Liste kopieren</button></div>':""}</div>
 <div class="adm-card"><div class="note" style="margin-top:0">Änderungen sind sofort für alle sichtbar und bleiben bei Updates erhalten. Der Code schützt nur die Oberfläche.</div><div class="row"><button id="admOut">Admin beenden</button></div></div></div>`;
 $("admX").onclick=closeAdmin;
 $("admQ").oninput=e=>{admQ=e.target.value;const pos=e.target.selectionStart;renderAdmin();const i=$("admQ");i.focus();i.setSelectionRange(pos,pos);};
 $("admPt").onclick=()=>{const t=$("admT").value;closeAdmin();adminDraw=null;startCross("fixnew");startCross.t=t;};
 $("admArea").onclick=()=>{const t=$("admT").value;closeAdmin();adminDraw={t};$("bDraw").click();dArea=true;dColor=TYPE_COL[t]||"#15243a";
  document.querySelectorAll("#drawBar .c").forEach(x=>x.classList.toggle("sel",x.dataset.c===dColor));setDrawUI();status(`${TYPE_NAME(t)}: Fläche mit dem Finger umfahren.`,true);};
 $("admOut").onclick=()=>{admin=false;$("bAdmChip").hidden=true;closeAdmin();status("Admin beendet.");};
 if($("admCopy"))$("admCopy").onclick=()=>copyTxt(FIX.map(p=>`${p.t} ${p.n||TYPE_NAME(p.t)}: ${mgrs(p.c[0],p.c[1])}${p.g?", "+fmtA(measure(p.g,true).a):""}${p.txt?" ("+p.txt+")":""}`).join("\n"));
 el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const p=FIX.find(x=>x.id===b.dataset.id);if(!p)return;const a=b.dataset.a;
  if(a==="show"){closeAdmin();map.setView(p.c,17);showFix(p);}
  else if(a==="edit"){closeAdmin();fixForm(p);}
  else if(a==="move"){closeAdmin();fixMove=p;startCross("fixmove");}
  else if(a==="del"){if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Wirklich?";return;}dbReq("/"+p.id,"DELETE").then(()=>status("Gelöscht.")).catch(fbErr);}});}
function adminSheet(){
 if(admin){openAdmin();return;}
 if(false){sheetOpen(`<h2>Admin aktiv</h2><div class="note">Neuen festen Punkt: unten „Markieren“, dann „Für alle speichern“. Fester Bereich: mit „Malen“ eine Fläche zeichnen, antippen, „Als festen Bereich für alle speichern“. Bestehende Punkte antippen zum Ändern.</div><div class="row"><button id="aOut">Admin beenden</button></div>`);$("aOut").onclick=()=>{admin=false;sheetClose();status("Admin beendet.");};return;}
 sheetOpen(`<h2>Admin</h2><input type="password" id="aP" placeholder="Code" inputmode="numeric" autocomplete="off"><div class="row"><button class="pri" id="aIn">Freischalten</button></div><div class="note" id="aMsg"></div>`);
 const go=()=>{if($("aP").value.trim()===ADMIN_CODE){admin=true;$("bAdmChip").hidden=false;openAdmin();}else $("aMsg").textContent="Code falsch.";};
 $("aIn").onclick=go;$("aP").onkeydown=e=>{if(e.key==="Enter")go();};}

loadIndex();
initFix();
startLoc();
</script>
