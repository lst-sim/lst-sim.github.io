name: ORGL-Karte Daten aktualisieren

on:
  schedule:
    - cron: "17 2 * * 1"   # jeden Montag ca. 03:17 Uhr (MEZ)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "orgl-friesland/update-data.js"
      - "orgl-friesland/index.html"
      - ".github/workflows/orgl-data.yml"

permissions:
  contents: write

concurrency:
  group: orgl-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: OSM-Daten holen und auswerten
        run: node orgl-friesland/update-data.js
      - name: data.json speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add orgl-friesland/data.json
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "ORGL-Karte: OSM-Daten aktualisiert"
          git pull --rebase origin main
          git push
