name: ORGL-Karte Daten aktualisieren (Friesland + Nachbarkreise)

on:
  schedule:
    - cron: "17 1 1 * *"   # am 1. jedes Monats nachts
  workflow_dispatch:
    inputs:
      nur:
        description: "Nur diese Kreisschlüssel holen (z. B. 04011,04012). Leer = alle."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: orgl-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node orgl-friesland/update-germany.js list kreisliste.json
      - run: node orgl-friesland/update-germany.js shard kreisliste.json 0 0 neu
        env:
          NUR: ${{ github.event.inputs.nur }}
      - run: node orgl-friesland/update-germany.js index neu orgl-friesland/data
      - name: Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add orgl-friesland/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "ORGL-Karte: OSM-Daten aktualisiert"
          for n in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep 10; done
